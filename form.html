<html>
<head>
    <title>FORM</title>
</head>
<body bgcolor="lavender">

    <h1 align="center" style="color:black;">
        <u>STUDENT REGISTRATION FORM</u>
    </h1>

    <form action="">
        <fieldset style="background-color: Lightskyblue; width: 550px; margin: auto;">
            <legend align="center"><b>Student Details</b></legend>

            <table cellpadding="10" cellspacing="5" align="center">

                <tr>
                    <td>First Name:</td>
                    <td><input type="text" name="fname"></td>
                </tr>

                <tr>
                    <td>Last Name:</td>
                    <td><input type="text" name="lname"></td>
                </tr>

                <tr>
                    <td>Father's Name:</td>
                    <td><input type="text" name="fathername"></td>
                </tr>

                <tr>
                    <td>Mother's Name:</td>
                    <td><input type="text" name="mothername"></td>
                </tr>

                <tr>
                    <td>Mobile Number:</td>
                    <td>
                        <input type="text" name="countrycode" value="+91" size="2">
                        <input type="tel" name="phone" maxlength="10" size="10">
                    </td>
                </tr>

                <tr>
                    <td>Date of Birth:</td>
                    <td><input type="date" name="dob"></td>
                </tr>

                <tr>
                    <td>Email:</td>
                    <td><input type="email" name="email"></td>
                </tr>

                <tr>
                    <td>Password:</td>
                    <td><input type="password" name="password"></td>
                </tr>

                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio" name="gender" value="Male"> Male
                        <input type="radio" name="gender" value="Female"> Female
                    </td>
                </tr>

                <tr>
                    <td>Choose Course:</td>
                    <td>
                        <select name="course">
                            <option value="">---Select---</option>
                            <option value="HTML">HTML</option>
                            <option value="CSS">CSS</option>
                            <option value="JAVA">JAVA</option>
                            <option value="C">C</option>
                            <option value="C++">C++</option>
                            <option value="PYTHON">PYTHON</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Hobbies:</td>
                    <td>
                        <input type="checkbox" name="hobbies" value="Singing"> Singing
                        <input type="checkbox" name="hobbies" value="Dancing"> Dancing
                        <input type="checkbox" name="hobbies" value="Playing"> Playing
                    </td>
                </tr>

                <tr>
                    <td>Address:</td>
                    <td><textarea name="address" rows="3" cols="20"></textarea></td>
                </tr>

                <tr>
                    <td>Photo:</td>
                    <td><input type="file" name="photo"></td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>
        </fieldset>
    </form>

</body>
</html>
