<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLES</title>
    <style>
        table{
            border-collapse: collapse;
        }
        table,td,th,td{
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <table style="border:1px solid">
        <tr>
            <th colspan="2">Company</th>
            <th>Contact</th>
            <th>Country</th>
        </tr>
        <tr>
            <td>A1 FREDS FUTTERKISTE</td>
            <td>Maria Anders</td>
            <td>Germany</td>
        </tr>
        <tr>
            <td>Starbucks</td>
            <td>Naman</td>
            <td>India</td>
        </tr>
        <tr>
            <td>Centro commercial</td>
            <td>francisco chang</td>
            <td>mexico</td>
        </tr>
    </table>
</body>
</html>
